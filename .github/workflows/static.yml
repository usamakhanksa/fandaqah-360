# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Every page asks for its scripts and styles by content stamp (site.js?v=…), so Cloudflare and browsers can never
      # pair a new page with an old script. Stamp here as well, so a commit that forgot to restamp still deploys correctly.
      - name: Stamp assets
        run: python3 -I tools/stamp-assets.py
      # Build the public site: the repo root minus internal folders. Keep this list in step with _config.yml,
      # which gives the same result if Pages is ever set to "Deploy from a branch".
      - name: Build public site
        run: |
          # a leading slash anchors a folder to the repo root, so book/media/<X>/banners/ still ships
          rsync -a ./ _site/ --exclude '.git*' --exclude '/.github' --exclude '/_site' --exclude '/_internal' \
            --exclude '/campaigns' --exclude '/archive' --exclude '/tools' --exclude '/banners' \
            --exclude 'README.md' --exclude '/_config.yml' --exclude '/.scrollcraft.json' \
            --exclude '/*.pdf' --exclude '*.php' --exclude '/api' --exclude '.htaccess' --exclude '/*.zip'
          # the campaign pages are named -index.html in the repo, so a PHP host serves their index.php copy;
          # Pages runs no PHP, so here each one is published as its folder's index.html
          find _site -name '-index.html' -execdir mv -- {} index.html \;
      # The PHP copies (for a PHP host) never ship to Pages, which cannot run them. Flag them when they fall behind
      # their pages, without holding up this deploy.
      - name: Check the PHP copies are current
        run: python3 -I tools/build-php.py --check || echo "::warning::PHP copies are out of date. Run python tools/stamp-assets.py, then python tools/build-php.py, and commit."
      # Guards: nothing internal ships, every page is fully translated, every link resolves
      - name: Block internal files from the public site
        run: |
          if find _site \( -iname '*.pdf' -o -iname '*.psd' -o -iname '*.docx' -o -iname '*.md' -o -iname '*.py' -o -iname '*.php' -o -iname '.htaccess' \) | grep -q .; then
            echo "Internal files found in the public site:"; find _site \( -iname '*.pdf' -o -iname '*.psd' -o -iname '*.docx' -o -iname '*.md' -o -iname '*.py' -o -iname '*.php' -o -iname '.htaccess' \); exit 1
          fi
      - name: Check Arabic translations and links
        run: |
          python3 -I tools/check-i18n.py _site
          python3 -I tools/check-links.py _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
