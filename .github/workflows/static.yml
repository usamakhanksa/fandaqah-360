# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Guards: only the public site ships, and every page is fully translated
      - name: Block internal files from the public site
        run: |
          if find site \( -iname '*.pdf' -o -iname '*.psd' -o -iname '*.docx' -o -path '*/_internal/*' \) | grep -q .; then
            echo "Internal files found under site/:"; find site \( -iname '*.pdf' -o -iname '*.psd' -o -iname '*.docx' \); exit 1
          fi
      - name: Check Arabic translations
        run: python3 -I tools/check-i18n.py site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the public website. campaigns/, archive/ and _internal/ are never deployed.
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
