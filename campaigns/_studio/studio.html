<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Fandaqah 360 creative studio</title>
<!-- Renders one creative from URL params: ?c=A&lang=ar&kind=ad&i=1&fmt=feed
     kind: ad (i = headline variant 1|2) · slide (i = carousel / reel frame 1–4) · og (i = page key)
     fmt: feed 1080x1350 · story 1080x1920 · og 1200x630. Serve the repo root (see README) so /assets resolves. -->
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  html,body{margin:0;background:#888}
  body{width:max-content}
  .art{position:relative;overflow:hidden;isolation:isolate;width:1080px;height:1350px;background:var(--bg);color:var(--ink);font-family:var(--f-sans)}
  .fmt-story{height:1920px}
  .fmt-og{width:1200px;height:630px}
  .theme-dark{background:var(--navy-2);color:#fff}
  .art em{font-style:normal;color:var(--coral)}
  .theme-dark em,.kind-cta em,.kind-hook em{color:#F48C78}
  /* photo plane */
  .art-photo{position:absolute;inset:0 0 auto 0;height:60%;margin:0;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent);mask-image:linear-gradient(to bottom,#000 62%,transparent)}
  .art-photo img{width:100%;height:100%;object-fit:cover}
  .theme-dark .art-photo img{filter:brightness(.6) saturate(.9)}
  .fmt-story .art-photo{height:56%}
  /* top bar */
  .art-top{position:absolute;z-index:5;inset:48px 56px auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .fmt-story .art-top{top:150px}
  .art-logo{display:inline-flex;align-items:flex-end;gap:8px;padding:14px 22px 14px 18px;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:var(--e2)}
  .art-logo img{height:64px;width:auto}
  .art-logo b{padding-bottom:4px;font:600 36px/1 "Source Serif 4",Georgia,serif;color:var(--coral)}
  .art-chip{padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--ink);font-size:24px;font-weight:700;box-shadow:var(--e1);white-space:nowrap}
  /* device plane */
  /* devices and their label stay on the photo's screen side in both languages: the photograph itself never mirrors */
  .art-device{position:absolute;z-index:2;right:70px;top:330px;transform-origin:100% 0}
  .art-device .laptop,.art-device .monitor{transform:scale(1.32);transform-origin:inherit}
  .fmt-story .art-device{top:520px}
  /* copy */
  .art-copy{position:absolute;z-index:4;inset:auto 64px 70px;display:grid;justify-items:start;gap:26px}
  .fmt-story .art-copy{bottom:300px}
  .art h1{margin:0;font:600 84px/1.04 var(--f-serif);letter-spacing:-.025em;text-wrap:balance}
  html[lang="ar"] .art h1{font-size:76px;line-height:1.28}
  .art .sub{margin:0;max-width:900px;font-size:31px;line-height:1.45;color:var(--ink-2)}
  .theme-dark .sub,.kind-cta .sub{color:rgba(255,255,255,.84)}
  .art-cta{display:inline-flex;align-items:center;gap:18px;margin-top:6px;padding:24px 38px;border-radius:14px;background:var(--coral-btn);color:#fff;font-size:34px;font-weight:700;box-shadow:0 20px 40px -18px rgba(212,65,59,.85)}
  .art-cta .ic{width:34px;height:34px;stroke-width:2.2}
  [dir="rtl"] .art-cta .ic{transform:scaleX(-1)}
  .art-url{font-size:24px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
  .theme-dark .art-url,.kind-cta .art-url,.kind-hook .art-url{color:rgba(255,255,255,.7)}
  .art-tag{position:absolute;z-index:5;right:56px;top:290px;padding:6px 14px;border:1.5px solid currentColor;border-radius:8px;font-size:19px;font-weight:600;opacity:.75}
  .fmt-story .art-tag{top:480px}
  .art-count{position:absolute;z-index:6;inset-inline-end:56px;bottom:56px;padding:8px 16px;border-radius:999px;background:rgba(24,23,47,.55);color:#fff;font-size:22px;font-weight:700}
  .fmt-story .art-count{bottom:250px}
  .art-legal{position:absolute;z-index:6;inset:auto 64px 24px;margin:0;font-size:16px;line-height:1.4;opacity:.6}
  .fmt-story .art-legal{bottom:200px}
  /* hook slide: full-bleed photo with the problem written large */
  .kind-hook{background:var(--navy-2);color:#fff}
  .kind-hook .art-photo{height:100%;-webkit-mask-image:none;mask-image:none}
  .kind-hook .art-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom, rgba(34,37,56,.15) 20%, rgba(34,37,56,.92) 78%)}
  .kind-hook .art-copy{bottom:150px}
  .fmt-story.kind-hook .art-copy{bottom:380px}
  .kind-hook h1{font-size:104px}
  html[lang="ar"] .kind-hook h1{font-size:92px}
  /* content slides */
  .kind-content .art-copy{inset:250px 64px auto;gap:20px}
  .fmt-story.kind-content .art-copy{top:420px}
  .kind-content h1{font-size:78px}
  html[lang="ar"] .kind-content h1{font-size:70px}
  .kind-content .art-device{top:auto;bottom:170px;right:auto;left:50%;transform:translateX(-50%)}
  .kind-content .art-tag{top:auto;bottom:96px;right:50%;transform:translateX(50%)}
  .fmt-story.kind-content .art-tag{bottom:330px}
  .kind-content .art-device .laptop,.kind-content .art-device .monitor{transform:scale(1.55);transform-origin:50% 100%}
  .fmt-story.kind-content .art-device{bottom:420px}
  .fmt-story.kind-content .art-device .laptop,.fmt-story.kind-content .art-device .monitor{transform:scale(1.7)}
  .proof{position:absolute;z-index:3;inset:auto 64px 170px;display:grid;gap:22px}
  .fmt-story .proof{bottom:380px}
  .proof-card{display:flex;align-items:center;gap:26px;padding:30px 34px;border:2px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--e1);font:600 40px/1.2 var(--f-serif)}
  .proof-card .icon-circle{width:92px;height:92px}
  .proof-card .icon-circle .ic{width:42px;height:42px}
  .proof-flow{display:grid;gap:14px}
  .proof-flow .proof-card{padding:24px 30px}
  .proof-flow i{display:block;width:3px;height:26px;margin-inline-start:76px;background:var(--line-2)}
  /* CTA slide */
  .kind-cta{background:var(--navy);color:#fff}
  .kind-cta .art-copy{inset:auto 64px 140px}
  .fmt-story.kind-cta .art-copy{bottom:400px}
  .kind-cta h1{font-size:96px}
  html[lang="ar"] .kind-cta h1{font-size:86px}
  .kind-cta .leaf{position:absolute;z-index:-1;inset-inline-end:-60px;top:120px;width:420px;opacity:.55}
  [dir="rtl"] .kind-cta .leaf{transform:scaleX(-1)}
  /* og */
  .fmt-og .art-photo{inset:0 0 0 auto;width:54%;height:100%;-webkit-mask-image:linear-gradient(to right,transparent,#000 30%);mask-image:linear-gradient(to right,transparent,#000 30%)}
  .fmt-og .art-top{inset:40px 48px auto}
  .fmt-og .art-logo{padding:10px 16px 10px 12px;border-radius:14px}
  .fmt-og .art-logo img{height:46px}
  .fmt-og .art-logo b{font-size:27px}
  .fmt-og .art-chip{display:none}
  .fmt-og .art-copy{inset:auto auto 56px 56px;max-width:600px;gap:18px}
  .fmt-og h1{font-size:56px}
  .fmt-og .art-eyebrow{font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .theme-dark.fmt-og .art-eyebrow{color:#C7C9D6}
  .fmt-og .art-device{top:auto;bottom:46px;right:40px;transform:scale(.82);transform-origin:100% 100%}
  .fmt-og .art-device .laptop,.fmt-og .art-device .monitor{transform:none}
  .fmt-og .art-tag,.fmt-og .art-url{display:none}
</style>
</head>
<body>
<div id="art" class="art"></div>
<script src="copy.js"></script>
<script>
(() => {
  const S = window.STUDIO, q = new URLSearchParams(location.search);
  const kind = q.get('kind') || 'ad', fmt = q.get('fmt') || 'feed', i = q.get('i') || '1';
  const lang = kind === 'og' ? 'en' : (q.get('lang') || 'en');
  const og = kind === 'og' ? S.og[i] : null;
  const code = og ? og.c : (q.get('c') || 'A');
  const C = S.campaigns[code], T = C[lang], tags = S.tags[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const ico = id => `<svg class="ic" aria-hidden="true"><use href="${S.base}icons.svg#${id}"/></svg>`;
  const side = (items, brand = 'fandaqah <b>360</b>') => `<div class="ui-side"><div class="ui-brand"><i></i>${brand}</div><ul>${items.map((t, n) => `<li${n ? '' : ' class="on"'}>${ico(t[0])}${t[1]}</li>`).join('')}</ul></div>`;
  const chart = `<div class="ui-card ui-chart"><svg viewBox="0 0 220 70" preserveAspectRatio="none"><g stroke="#EDE8E1" stroke-width="1"><path d="M0 17H220M0 35H220M0 53H220"/></g><path d="M4 58 L30 50 L56 54 L82 40 L108 46 L134 30 L160 36 L186 22 L216 12" fill="none" stroke="#E9584D" stroke-width="2" stroke-linejoin="round"/></svg></div>`;
  const rows = `<div class="ui-grid" style="--n:2"><div class="ui-card ui-rows"><div class="ui-row"><i style="--c:#F2B9A0"></i><span></span><span></span></div><div class="ui-row"><i style="--c:#E9C9A6"></i><span></span><span></span></div></div><div class="ui-card ui-rows"><div class="ui-row"><i style="--c:#E9584D"></i><span></span><span></span></div><div class="ui-row"><i style="--c:#C9C2A0"></i><span></span><span></span></div></div></div>`;
  const DEV = {
    laptopA: () => `<div class="laptop" style="--w:430px"><div class="laptop-screen"><div class="ui">${side([['i-calendar-days', 'Reservations'], ['i-bed-double', 'Rooms'], ['i-sparkles', 'Housekeeping'], ['i-chart-line', 'Reports']])}<div class="ui-main"><div class="ui-top"><span>&larr;</span></div><div class="ui-h">Reservations</div>${chart}${rows}</div></div></div><div class="laptop-base"></div></div>`,
    laptopB: () => `<div class="laptop" style="--w:430px"><div class="laptop-screen"><div class="ui">${side([['i-layout-dashboard', 'Dashboard'], ['i-calendar-days', 'Reservations'], ['i-bed-double', 'Rooms'], ['i-sparkles', 'Housekeeping'], ['i-coins', 'Accounting']])}<div class="ui-main"><div class="ui-top"><span>&larr;</span></div><div class="ui-h">Dashboard</div>${chart}${rows}</div></div></div><div class="laptop-base"></div></div>`,
    monitorC: () => `<div class="monitor" style="--w:430px"><div class="monitor-screen"><div class="ui ui--dark">${side([['i-layout-dashboard', 'Overview'], ['i-share-2', 'Interfaces'], ['i-settings', 'Operations'], ['i-chart-line', 'Reports']])}<div class="ui-main"><div class="pms-map"><div class="pms-core">Your existing PMS<small>Opera / mandated PMS</small></div><svg class="pms-lines" viewBox="0 0 200 22" preserveAspectRatio="none"><path d="M100 0V10M20 10H180M20 10V22M100 10V22M180 10V22" fill="none" stroke="#E9584D" stroke-width="1.4"/></svg><div class="pms-nodes"><div>${ico('i-database')}Back office</div><div>${ico('i-bed-double')}Hotel operations</div><div>${ico('i-share-2')}Supported interfaces</div></div></div></div></div></div><div class="monitor-stand"></div><div class="monitor-foot"></div></div>`,
    laptopD: () => `<div class="laptop" style="--w:440px"><div class="laptop-screen"><div class="ui">${side([['i-network', 'Group overview'], ['i-building-2', 'Properties'], ['i-chart-line', 'Reports'], ['i-key', 'Permissions']], 'Your <b>group</b>')}<div class="ui-main"><div class="ui-top"><span class="grp-brand">● Your brand</span></div><div class="ui-h">Group overview<small>Group and property-level views</small></div>${chart}<div class="ui-grid" style="--n:4">${['Riyadh', 'Jeddah', 'Al Khobar', 'Madinah'].map((c, n) => `<div class="ui-card grp-tile"><b>Property ${n + 1}</b><small>${c}</small><div class="grp-bar"><i style="--v:${[78, 64, 71, 58][n]}%"></i></div></div>`).join('')}</div></div></div></div><div class="laptop-base"></div></div>`
  };
  const art = document.getElementById('art');
  const photo = `<figure class="art-photo"><img src="${S.base}${C.photo}" style="object-position:${C.photoPos}" alt=""></figure>`;
  const top = `<header class="art-top"><span class="art-logo"><img src="${S.base}img/brand-dark-340.webp" alt=""><b>360</b></span><span class="art-chip">${T.chip}</span></header>`;
  const cta = `<span class="art-cta">${T.cta}${ico('i-arrow-right')}</span><span class="art-url">${T.url}</span>`;
  const legal = T.legal ? `<p class="art-legal">${T.legal}</p>` : '';
  const tag = `<span class="art-tag">${C.device === 'laptopD' ? tags.brand : tags.ui}</span>`;
  let cls = `art fmt-${fmt} theme-${C.theme}`, html = '';

  if (kind === 'og') {
    html = `${photo}<div class="art-device">${DEV[C.device]()}</div>${top}<div class="art-copy"><span class="art-eyebrow">${og.chip}</span><h1>${og.h}</h1></div>`;
  } else if (kind === 'ad') {
    const ad = T.ads[+i - 1];
    html = `${photo}<div class="art-device">${DEV[C.device]()}</div>${tag}${top}<div class="art-copy"><h1>${ad.h}</h1><p class="sub">${ad.s}</p>${cta}</div>${legal}`;
  } else {
    const n = +i, sl = T.slides[n - 1], count = `<span class="art-count">${n}/4</span>`;
    if (n === 1) {
      cls += ' kind-hook';
      html = `${photo}${top}<div class="art-copy"><h1>${sl.h}</h1><span class="art-url">${T.url}</span></div>${count}`;
    } else if (n === 4) {
      cls += ' kind-cta';
      html = `<svg class="leaf" viewBox="0 0 220 320" aria-hidden="true"><use href="${S.base}icons.svg#art-leaves"/></svg>${top}<div class="art-copy"><h1>${sl.h}</h1><p class="sub">${sl.s}</p>${cta}</div>${count}${legal}`;
    } else {
      cls += ' kind-content';
      let body = '';
      if (sl.list) body = `<div class="proof">${sl.list.map((t, k) => `<div class="proof-card"><span class="icon-circle">${ico(['i-coins', 'i-shopping-cart', 'i-bed-double'][k])}</span>${t}</div>`).join('')}</div>`;
      else if (sl.flow) body = `<div class="proof proof-flow">${sl.flow.map((t, k) => `${k ? '<i></i>' : ''}<div class="proof-card"><span class="icon-circle">${ico(['i-calendar-days', 'i-bed-double', 'i-user', 'i-coins'][k])}</span>${t}</div>`).join('')}</div>`;
      else body = `<div class="art-device">${DEV[C.device]()}</div>${tag}`;
      html = `${top}<div class="art-copy"><h1>${sl.h}</h1>${sl.s ? `<p class="sub">${sl.s}</p>` : ''}</div>${body}${count}${legal}`;
    }
  }
  art.className = cls; art.innerHTML = html;
  // signal for the renderer: fonts and images are ready
  Promise.all([document.fonts.ready, ...[...art.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))])
    .then(() => { document.body.dataset.ready = '1'; });
})();
</script>
</body>
</html>
