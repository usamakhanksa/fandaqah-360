<!doctype html>
<!-- Share-image studio for the landing site (never published). Rendered at 1200x630 by tools/render-landing-og.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG studio</title>
<link rel="stylesheet" href="../../landing/assets/redesign/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f2f0eb; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden;
        background: radial-gradient(60% 90% at 78% 82%, rgb(255 255 255 / .6), transparent 64%), #f3ede4; }
  .copy { position: absolute; left: 64px; top: 56px; bottom: 56px; width: 600px; display: flex; flex-direction: column; }
  .logo { width: 150px; height: auto; }
  .kicker { margin-top: auto; font: 700 15px/1.3 Inter, Arial, sans-serif; letter-spacing: .07em; text-transform: uppercase; color: #e95a54; }
  .kicker [lang=ar] { letter-spacing: 0; font-family: Arabic, Inter, sans-serif; text-transform: none; }
  h1 { margin: 16px 0 0; font: 700 62px/1.04 Georgia, 'Times New Roman', serif; letter-spacing: -.03em; color: #2a273c; text-wrap: balance; }
  .ar { margin-top: 14px; font: 700 40px/1.3 Arabic, Inter, sans-serif; color: #2a273c; direction: rtl; text-align: left; unicode-bidi: plaintext; }
  .sub { margin-top: 18px; font: 500 20px/1.45 Inter, Arial, sans-serif; color: #57536a; max-width: 30ch; }
  .arch { position: absolute; left: 720px; right: 56px; top: 64px; bottom: 92px; border-radius: 300px 300px 0 0; overflow: hidden;
          box-shadow: 0 0 0 1px rgb(42 39 60 / .08); }
  .arch img { width: 100%; height: 100%; object-fit: cover; }
  .arch::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 30px 14px 36px -24px rgb(42 39 60 / .5); }
  .sill { position: absolute; left: 704px; right: 40px; bottom: 78px; height: 14px; border-radius: 3px; background: linear-gradient(#f3eee6, #ddd3c4);
          box-shadow: inset 0 1px 0 #fff, 0 12px 20px -10px rgb(42 39 60 / .35); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #e95a54; }
</style>
</head>
<body>
<div class="og">
  <div class="copy">
    <img class="logo" src="../../landing/assets/site/brand-dark-340.webp" alt="">
    <p class="kicker"></p>
    <h1></h1>
    <p class="ar" lang="ar" dir="rtl"></p>
    <p class="sub"></p>
  </div>
  <div class="arch"><img alt=""></div>
  <span class="sill"></span>
  <span class="bar"></span>
</div>
<script>
  // ?i=N picks an item from og-data.json (written by tools/build-landing.py)
  fetch('og-data.json').then(r => r.json()).then(items => {
    const it = items[+new URLSearchParams(location.search).get('i') || 0];
    const [en, ar] = it.kicker.split(' · ');
    document.querySelector('.kicker').innerHTML = ar ? `${en} · <span lang="ar">${ar}</span>` : en;
    document.querySelector('h1').textContent = it.en;
    document.querySelector('.ar').textContent = it.ar;
    document.querySelector('.sub').textContent = it.sub;
    const img = document.querySelector('.arch img');
    img.src = '../../landing/' + it.photo;
    img.style.objectPosition = it.pos;
    Promise.all([document.fonts.ready, img.decode()]).then(() => { document.body.dataset.ready = it.key; });
  });
</script>
</body>
</html>
